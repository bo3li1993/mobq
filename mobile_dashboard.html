<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>إحصائيات الغياب - متوسطة سالم الحسينان</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0f1e;
  --card: #111827;
  --card2: #1a2235;
  --border: rgba(255,255,255,0.08);
  --accent: #3b82f6;
  --success: #10b981;
  --danger: #ef4444;
  --warn: #f59e0b;
  --text: #f1f5f9;
  --text2: #94a3b8;
  --text3: #475569;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { background:var(--bg); color:var(--text); font-family:'Tajawal',sans-serif; min-height:100vh; }

/* NAV */
.nav {
  position: sticky; top:0; z-index:100;
  background: rgba(10,15,30,0.95);
  backdrop-filter: blur(12px);
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items:center; justify-content:space-between;
}
.nav-title { font-size:15px; font-weight:800; }
.nav-sub { font-size:11px; color:var(--text2); }
.live { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--success); }
.live-dot { width:7px; height:7px; border-radius:50%; background:var(--success); animation:pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

/* TABS */
.tabs {
  display: flex; overflow-x:auto; gap:8px;
  padding: 12px 16px;
  scrollbar-width:none;
  border-bottom: 1px solid var(--border);
  background: var(--card);
}
.tabs::-webkit-scrollbar { display:none; }
.tab {
  flex-shrink:0; padding:7px 16px;
  border-radius:20px; font-size:13px; font-weight:600;
  border:1px solid var(--border); background:transparent;
  color:var(--text2); cursor:pointer; font-family:'Tajawal',sans-serif;
  transition: all 0.2s;
}
.tab.active { background:var(--accent); color:#fff; border-color:var(--accent); }

/* MAIN */
.main { padding:16px; padding-bottom:40px; }

/* STAT CARDS */
.stats-grid {
  display: grid; grid-template-columns: repeat(2, 1fr); gap:10px;
  margin-bottom:16px;
}
.stat-card {
  background:var(--card); border-radius:16px;
  padding:16px; border:1px solid var(--border);
  position:relative; overflow:hidden;
}
.stat-card::before {
  content:''; position:absolute; inset:0;
  opacity:0.06; border-radius:16px;
}
.stat-card.blue::before { background:var(--accent); }
.stat-card.green::before { background:var(--success); }
.stat-card.red::before { background:var(--danger); }
.stat-card.warn::before { background:var(--warn); }
.stat-icon { font-size:22px; margin-bottom:8px; }
.stat-val { font-size:30px; font-weight:800; line-height:1; }
.stat-val.blue { color:var(--accent); }
.stat-val.green { color:var(--success); }
.stat-val.red { color:var(--danger); }
.stat-val.warn { color:var(--warn); }
.stat-label { font-size:12px; color:var(--text2); margin-top:4px; }

/* SECTION */
.section { margin-bottom:16px; }
.section-title {
  font-size:14px; font-weight:700; color:var(--text2);
  padding:0 4px; margin-bottom:10px;
  display:flex; align-items:center; gap:6px;
}

/* CLASS CARDS */
.class-card {
  background:var(--card); border-radius:14px;
  border:1px solid var(--border);
  margin-bottom:8px; overflow:hidden;
  cursor:pointer; transition:border-color 0.2s;
}
.class-card:active { opacity:0.8; }
.class-card.has-absent { border-color:rgba(239,68,68,0.3); }
.class-header {
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 16px;
}
.class-name { font-size:15px; font-weight:700; }
.class-grade { font-size:12px; color:var(--text2); margin-top:2px; }
.class-badge {
  padding:4px 12px; border-radius:20px;
  font-size:12px; font-weight:700;
}
.badge-ok { background:rgba(16,185,129,0.15); color:var(--success); }
.badge-absent { background:rgba(239,68,68,0.15); color:var(--danger); }
.class-detail {
  display:none; padding:0 16px 14px;
  border-top:1px solid var(--border);
}
.class-card.open .class-detail { display:block; }
.class-card.open .class-header { border-bottom:none; }

/* PERIOD CHIPS */
.periods-row {
  display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; padding-top:12px;
}
.period-chip {
  padding:5px 10px; border-radius:20px;
  font-size:11px; font-weight:600;
  background:var(--card2); border:1px solid var(--border);
  color:var(--text2);
}
.period-chip.has-absent {
  background:rgba(239,68,68,0.1);
  border-color:rgba(239,68,68,0.3);
  color:var(--danger);
}

/* STUDENT TABLE */
.stu-table { width:100%; font-size:12px; border-collapse:collapse; }
.stu-table th {
  text-align:right; padding:6px 4px;
  color:var(--text3); font-weight:600;
  border-bottom:1px solid var(--border);
}
.stu-table td { padding:7px 4px; border-bottom:1px solid var(--border); }
.stu-table tr:last-child td { border-bottom:none; }
.dot-ok { color:var(--success); font-size:14px; }
.dot-no { color:var(--danger); font-size:14px; }

/* SEARCH */
.search-box {
  width:100%; padding:11px 16px;
  border-radius:12px; border:1px solid var(--border);
  background:var(--card); color:var(--text);
  font-family:'Tajawal',sans-serif; font-size:14px;
  margin-bottom:12px; outline:none;
}
.search-box:focus { border-color:var(--accent); }

/* DATE PICKER */
.date-row { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
.date-row select, .date-row input {
  flex:1; min-width:120px; padding:10px 12px;
  border-radius:12px; border:1px solid var(--border);
  background:var(--card); color:var(--text);
  font-family:'Tajawal',sans-serif; font-size:13px;
  outline:none;
}
.search-btn {
  padding:10px 20px; border-radius:12px;
  background:var(--accent); color:#fff;
  border:none; font-family:'Tajawal',sans-serif;
  font-size:14px; font-weight:700; cursor:pointer;
  width:100%;
}

/* ABSENCE LIST */
.absence-item {
  background:var(--card); border-radius:14px;
  border:1px solid var(--border); border-right:3px solid var(--danger);
  padding:12px 14px; margin-bottom:8px;
  display:flex; align-items:center; gap:12px;
}
.ai-rank { color:var(--text3); font-size:13px; min-width:22px; }
.ai-name { flex:1; font-size:14px; font-weight:600; }
.ai-class { font-size:12px; color:var(--accent); }
.ai-count {
  background:var(--danger); color:#fff;
  padding:3px 10px; border-radius:20px;
  font-size:12px; font-weight:800;
}

/* LOADING */
.loading {
  text-align:center; padding:40px;
  color:var(--text2); font-size:14px;
}
.spinner {
  width:32px; height:32px;
  border:3px solid var(--border);
  border-top-color:var(--accent);
  border-radius:50%; animation:spin 0.8s linear infinite;
  margin:0 auto 12px;
}
@keyframes spin { to{transform:rotate(360deg)} }

@media print {
  .nav { position:static; }
  .tabs { display:none !important; }
  .search-box, .search-btn { display:none !important; }
  [id^="tab-"] { display:none !important; }
  [id^="tab-"].printing { display:block !important; }
  .class-detail { display:block !important; }
  body { background:#fff !important; color:#000 !important; }
  .stat-card, .class-card, .result-card, .absence-item {
    background:#fff !important; border:1px solid #ccc !important;
    break-inside:avoid;
  }
  .stat-val.blue,.stat-val.green,.stat-val.red,.stat-val.warn { color:#000 !important; }
  .live,.search-box,.date-row { display:none !important; }
}

/* EMPTY */
.empty {
  text-align:center; padding:32px;
  color:var(--text2); font-size:14px;
}
.empty-icon { font-size:40px; margin-bottom:8px; }

/* GRADE GROUP */
.grade-label {
  font-size:11px; font-weight:700;
  color:var(--text3); padding:8px 4px 6px;
  letter-spacing:0.5px;
}

/* RESULT CARD */
.result-card {
  background:var(--card); border-radius:16px;
  border:1px solid var(--border); padding:16px;
  margin-bottom:12px;
}
.result-stats {
  display:grid; grid-template-columns:repeat(3,1fr);
  gap:8px; margin-bottom:14px;
}
.rs-item { text-align:center; }
.rs-val { font-size:22px; font-weight:800; }
.rs-label { font-size:11px; color:var(--text2); }
</style>
</head>
<body>

<nav class="nav">
  <div>
    <div class="nav-title">متوسطة سالم الحسينان</div>
    <div class="nav-sub">نظام إدارة الغياب والحضور</div>
  </div>
  <div style="display:flex;align-items:center;gap:8px">
    <div class="live">
      <div class="live-dot"></div>
      <span id="navDate">...</span>
    </div>
    <button onclick="openPrintModal()" style="background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:6px 12px;color:var(--text);font-family:'Tajawal',sans-serif;font-size:12px;font-weight:700;cursor:pointer">🖨️ PDF</button>
  </div>
</nav>

<div class="tabs">
  <button class="tab active" onclick="switchTab('overview',this)">📊 اليوم</button>
  <button class="tab" onclick="switchTab('classes',this)">🏫 الفصول</button>
  <button class="tab" onclick="switchTab('student',this)">👤 طالب</button>
  <button class="tab" onclick="switchTab('date',this)">📅 تاريخ</button>
  <button class="tab" onclick="switchTab('high',this)">⚠️ متكرر</button>
</div>

<div class="main">

  <!-- OVERVIEW -->
  <div id="tab-overview">
    <div class="stats-grid">
      <div class="stat-card blue">
        <div class="stat-icon">👥</div>
        <div class="stat-val blue" id="ov-total">—</div>
        <div class="stat-label">إجمالي الطلاب</div>
      </div>
      <div class="stat-card red">
        <div class="stat-icon">🔴</div>
        <div class="stat-val red" id="ov-absent">—</div>
        <div class="stat-label">غائبون اليوم</div>
      </div>
      <div class="stat-card green">
        <div class="stat-icon">🟢</div>
        <div class="stat-val green" id="ov-present">—</div>
        <div class="stat-label">حاضرون اليوم</div>
      </div>
      <div class="stat-card warn">
        <div class="stat-icon">📋</div>
        <div class="stat-val warn" id="ov-pct">—</div>
        <div class="stat-label">نسبة الحضور</div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">🏫 الغياب حسب المرحلة — اليوم</div>
      <div id="ov-grades"></div>
    </div>
  </div>

  <!-- CLASSES -->
  <div id="tab-classes" style="display:none">
    <input class="search-box" type="text" placeholder="🔍 ابحث عن فصل..." oninput="filterClasses(this.value)">
    <div id="classes-list"></div>
  </div>

  <!-- STUDENT -->
  <div id="tab-student" style="display:none">
    <select class="search-box" id="stu-class" onchange="loadStuNames()" style="margin-bottom:8px">
      <option value="">اختر الفصل...</option>
    </select>
    <select class="search-box" id="stu-name" onchange="showStudentRecord()">
      <option value="">اختر الطالب...</option>
    </select>
    <div id="stu-result"></div>
  </div>

  <!-- DATE -->
  <div id="tab-date" style="display:none">
    <div class="date-row">
      <select id="dt-class">
        <option value="">اختر الفصل...</option>
      </select>
      <input type="date" id="dt-date">
    </div>
    <button class="search-btn" onclick="searchByDate()">🔍 عرض الغياب</button>
    <div id="dt-result" style="margin-top:14px"></div>
  </div>

  <!-- HIGH ABSENCE -->
  <div id="tab-high" style="display:none">
    <div id="high-result">
      <div class="loading"><div class="spinner"></div>جارٍ التحميل...</div>
    </div>
  </div>

</div>

<!-- PRINT MODAL -->
<div id="printModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:999;align-items:flex-end;justify-content:center">
  <div style="background:var(--card);border-radius:20px 20px 0 0;padding:20px;width:100%;max-height:80vh;overflow-y:auto">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <span style="font-size:16px;font-weight:800">🖨️ طباعة كشف الغياب</span>
      <button onclick="closePrintModal()" style="background:var(--card2);border:1px solid var(--border);border-radius:50%;width:32px;height:32px;font-size:18px;cursor:pointer;color:var(--text)">✕</button>
    </div>
    
    <div style="margin-bottom:14px">
      <div style="font-size:13px;color:var(--text2);margin-bottom:8px">اختر الفصول للطباعة:</div>
      <div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap">
        <button onclick="selectAllPrint()" style="padding:7px 14px;border-radius:20px;border:1px solid var(--accent);background:var(--accent);color:#fff;font-family:'Tajawal',sans-serif;font-size:13px;font-weight:700;cursor:pointer">كل الفصول</button>
        <button onclick="clearAllPrint()" style="padding:7px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text2);font-family:'Tajawal',sans-serif;font-size:13px;cursor:pointer">مسح الكل</button>
      </div>
      <div id="printClassList" style="display:flex;flex-direction:column;gap:6px"></div>
    </div>

    <div style="margin-bottom:14px">
      <div style="font-size:13px;color:var(--text2);margin-bottom:8px">التاريخ:</div>
      <input type="date" id="printDate" style="width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-family:'Tajawal',sans-serif;font-size:13px;outline:none">
    </div>

    <button onclick="doPrint()" style="width:100%;padding:14px;border-radius:14px;background:var(--accent);color:#fff;border:none;font-family:'Tajawal',sans-serif;font-size:15px;font-weight:800;cursor:pointer;margin-top:4px">🖨️ طباعة</button>
  </div>
</div>

<!-- PRINT AREA -->
<div id="printArea" style="display:none"></div>

<style>
@media print {
  body > *:not(#printArea) { display:none !important; }
  #printArea { display:block !important; }
  .print-page {
    page-break-after: always;
    padding: 20px;
    font-family: 'Tajawal', sans-serif;
  }
  .print-page:last-child { page-break-after: avoid; }
  .print-header {
    text-align:center; margin-bottom:16px;
    border-bottom: 2px solid #000; padding-bottom:10px;
  }
  .print-title { font-size:18px; font-weight:800; }
  .print-sub { font-size:13px; color:#555; margin-top:4px; }
  .print-table { width:100%; border-collapse:collapse; font-size:12px; }
  .print-table th, .print-table td { border:1px solid #000; padding:5px 8px; text-align:right; }
  .print-table th { background:#f0f0f0; font-weight:700; }
  .print-stats { display:flex; gap:20px; margin-bottom:12px; font-size:13px; }
  .print-stat { border:1px solid #000; padding:6px 12px; border-radius:8px; text-align:center; }
  .print-stat span { display:block; font-size:20px; font-weight:800; }
}
</style>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxE4Gx_7E_b2hBT9pJESEGzsay_v0HOqxGOg15JeupO6K1fCdWdxBruWX9KPLgO9jIi/exec';

const CLASSES = [
  {id:'6/1',full:'الصف السادس 1',grade:'السادس'},
  {id:'6/2',full:'الصف السادس 2',grade:'السادس'},
  {id:'6/3',full:'الصف السادس 3',grade:'السادس'},
  {id:'6/4',full:'الصف السادس 4',grade:'السادس'},
  {id:'7/1',full:'الصف السابع 1',grade:'السابع'},
  {id:'7/2',full:'الصف السابع 2',grade:'السابع'},
  {id:'7/3',full:'الصف السابع 3',grade:'السابع'},
  {id:'7/4',full:'الصف السابع 4',grade:'السابع'},
  {id:'8/1',full:'الصف الثامن 1',grade:'الثامن'},
  {id:'8/2',full:'الصف الثامن 2',grade:'الثامن'},
  {id:'8/3',full:'الصف الثامن 3',grade:'الثامن'},
  {id:'9/1',full:'الصف التاسع 1',grade:'التاسع'},
  {id:'9/2',full:'الصف التاسع 2',grade:'التاسع'},
  {id:'9/3',full:'الصف التاسع 3',grade:'التاسع'},
  {id:'9/4',full:'الصف التاسع 4',grade:'التاسع'},
];

const PERIODS = [
  {id:1,short:'ح1',time:'7:30'},
  {id:2,short:'ح2',time:'8:15'},
  {id:3,short:'ح3',time:'9:00'},
  {id:4,short:'ح4',time:'9:45'},
  {id:5,short:'ح5',time:'10:30'},
  {id:6,short:'ح6',time:'11:15'},
  {id:7,short:'ح7',time:'12:00'},
];

let STUDENTS = {};
let ATTENDANCE = [];
let ALL_ATT = [];
let loaded = false;

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
}

function parseDate(raw) {
  if(raw instanceof Date) return `${raw.getFullYear()}/${String(raw.getMonth()+1).padStart(2,'0')}/${String(raw.getDate()).padStart(2,'0')}`;
  return String(raw).substring(0,10).replace(/-/g,'/');
}

async function loadData() {
  try {
    const res = await fetch(API_URL);
    const json = await res.json();

    STUDENTS = {};
    json.students.forEach(r => {
      const cls = String(r[2]||'').trim();
      const name = String(r[1]||'').trim();
      if(!cls || !name) return;
      if(!STUDENTS[cls]) STUDENTS[cls] = [];
      STUDENTS[cls].push(name);
    });

    ALL_ATT = json.attendance;
    const today = todayStr();
    ATTENDANCE = json.attendance.filter(r => {
      const d = parseDate(r[1]);
      return d === today && String(r[5]||'').trim() === 'غائب';
    });

    loaded = true;
    renderOverview();
    renderClasses();
    initSelects();
  } catch(e) {
    console.error(e);
  }
}

// ─── NAV DATE ───
const now = new Date();
const days = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس'];
const months = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
document.getElementById('navDate').textContent = `${days[now.getDay()]} ${now.getDate()} ${months[now.getMonth()]}`;

// ─── DEFAULT DATE ───
const y=now.getFullYear(), m=String(now.getMonth()+1).padStart(2,'0'), d=String(now.getDate()).padStart(2,'0');
document.getElementById('dt-date').value = `${y}-${m}-${d}`;

// ─── TABS ───
function switchTab(id, btn) {
  document.querySelectorAll('[id^="tab-"]').forEach(el=>el.style.display='none');
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+id).style.display='block';
  btn.classList.add('active');
  if(id==='high' && loaded) renderHigh();
}

// ─── OVERVIEW ───
function renderOverview() {
  const total = Object.values(STUDENTS).flat().length;
  const absent = new Set(ATTENDANCE.map(r=>String(r[2]).trim()+'|'+String(r[4]).trim())).size;
  const present = total - absent;
  const pct = total>0 ? Math.round((present/total)*100)+'%' : '—';

  document.getElementById('ov-total').textContent = total||'—';
  document.getElementById('ov-absent').textContent = absent;
  document.getElementById('ov-present').textContent = present||'—';
  document.getElementById('ov-pct').textContent = pct;

  const grades = [...new Set(CLASSES.map(c=>c.grade))];
  let html = '';
  grades.forEach(g => {
    const gClasses = CLASSES.filter(c=>c.grade===g);
    const gTotal = gClasses.reduce((s,c)=>(STUDENTS[c.id]||[]).length+s,0);
    const gAbsent = gClasses.reduce((s,c)=>{
      const ids = new Set(ATTENDANCE.filter(r=>String(r[2]).trim()===c.id).map(r=>r[4]));
      return s+ids.size;
    },0);
    const pct = gTotal>0 ? Math.round(((gTotal-gAbsent)/gTotal)*100) : 100;
    const color = gAbsent===0?'var(--success)':gAbsent<3?'var(--warn)':'var(--danger)';
    html += `<div style="background:var(--card);border-radius:14px;border:1px solid var(--border);padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between">
      <div>
        <div style="font-size:14px;font-weight:700">الصف ${g}</div>
        <div style="font-size:12px;color:var(--text2);margin-top:2px">${gClasses.length} فصول — ${gTotal} طالب</div>
      </div>
      <div style="text-align:center">
        <div style="font-size:20px;font-weight:800;color:${color}">${gAbsent}</div>
        <div style="font-size:11px;color:var(--text2)">غائب</div>
      </div>
    </div>`;
  });
  document.getElementById('ov-grades').innerHTML = html||'<div class="empty"><div class="empty-icon">✅</div>لا يوجد غياب اليوم</div>';
}

// ─── CLASSES ───
function renderClasses(filter='') {
  const container = document.getElementById('classes-list');
  const grades = [...new Set(CLASSES.map(c=>c.grade))];
  let html='';
  grades.forEach(g=>{
    const gCls = CLASSES.filter(c=>c.grade===g && (!filter||c.full.includes(filter)||c.id.includes(filter)));
    if(!gCls.length) return;
    html+=`<div class="grade-label">الصف ${g}</div>`;
    gCls.forEach(c=>{
      const students = STUDENTS[c.id]||[];
      const absentRecs = ATTENDANCE.filter(r=>String(r[2]).trim()===c.id);
      const absentIds = new Set(absentRecs.map(r=>String(r[4]).trim()));
      const absentCount = absentIds.size;
      const hasAbsent = absentCount>0;

      let periodsHtml='';
      PERIODS.forEach(p=>{
        const cnt = absentRecs.filter(r=>parseInt(r[3])===p.id).length;
        periodsHtml+=`<span class="period-chip ${cnt>0?'has-absent':''}">${p.short} ${cnt>0?'('+cnt+')':''}</span>`;
      });

      let tableRows='';
      students.forEach((name,i)=>{
        const num=i+1;
        const sid=c.id.replace('/','')+(num<10?'0':'')+num;
        let cells='';
        PERIODS.forEach(p=>{
          const absent=absentRecs.some(r=>String(r[4]).trim()===sid&&parseInt(r[3])===p.id);
          cells+=`<td style="text-align:center"><span class="${absent?'dot-no':'dot-ok'}">${absent?'✗':'✓'}</span></td>`;
        });
        tableRows+=`<tr style="${absentIds.has(sid)?'background:rgba(239,68,68,0.05)':''}">
          <td style="color:var(--text3)">${num}</td>
          <td style="font-size:11px;max-width:80px;word-break:break-word">${name}</td>
          ${cells}
        </tr>`;
      });

      html+=`<div class="class-card ${hasAbsent?'has-absent':''}" id="cc-${c.id.replace('/','_')}">
        <div class="class-header" onclick="toggleClass('${c.id.replace('/','_')}')">
          <div>
            <div class="class-name">${c.id}</div>
            <div class="class-grade">${c.full}</div>
          </div>
          <span class="class-badge ${hasAbsent?'badge-absent':'badge-ok'}">${hasAbsent?'غائب '+absentCount:'حضور كامل ✓'}</span>
        </div>
        <div class="class-detail">
          <div class="periods-row">${periodsHtml}</div>
          ${students.length?`<div style="overflow-x:auto"><table class="stu-table">
            <thead><tr><th>#</th><th>الاسم</th><th>ح1</th><th>ح2</th><th>ح3</th><th>ح4</th><th>ح5</th><th>ح6</th><th>ح7</th></tr></thead>
            <tbody>${tableRows}</tbody>
          </table></div>`:'<div class="empty" style="padding:16px">لا توجد بيانات</div>'}
        </div>
      </div>`;
    });
  });
  container.innerHTML = html||'<div class="empty"><div class="empty-icon">🔍</div>لا توجد نتائج</div>';
}

function toggleClass(id) {
  document.getElementById('cc-'+id)?.classList.toggle('open');
}

function filterClasses(val) { renderClasses(val); }

function showStudentRecord() {
  const cls=document.getElementById('stu-class').value;
  const num=parseInt(document.getElementById('stu-name').value);
  const el=document.getElementById('stu-result');
  if(!cls||!num) return;
  const name=(STUDENTS[cls]||[])[num-1]||'';
  const sid=cls.replace('/','')+(num<10?'0':'')+num;

  const recs=ALL_ATT.filter(r=>String(r[4]||'').trim()===sid);
  const byDate={};
  recs.forEach(r=>{
    const d=parseDate(r[1]);
    if(!byDate[d]) byDate[d]=[];
    byDate[d].push({p:parseInt(r[3]),s:String(r[5]).trim()});
  });
  const dates=Object.keys(byDate).sort().reverse();
  const totalAbs=recs.filter(r=>String(r[5]).trim()==='غائب').length;

  if(!dates.length){
    el.innerHTML=`<div class="empty"><div class="empty-icon">✅</div>لا يوجد أي غياب مسجل</div>`;
    return;
  }
  const level=totalAbs>=10?{t:'حرمان',c:'var(--danger)'}:totalAbs>=8?{t:'إنذار رسمي',c:'var(--danger)'}:totalAbs>=5?{t:'استدعاء ولي أمر',c:'var(--warn)'}:totalAbs>=3?{t:'تنبيه',c:'var(--warn)'}:{t:'طبيعي',c:'var(--success)'};

  let rows='';
  dates.forEach(d=>{
    const day=byDate[d];
    let cells='';
    for(let p=1;p<=7;p++){
      const r=day.find(x=>x.p===p);
      cells+=`<td style="text-align:center;font-size:13px"><span class="${!r?'':'r'&&r.s==='غائب'?'dot-no':'dot-ok'}">${!r?'—':r.s==='غائب'?'✗':'✓'}</span></td>`;
    }
    rows+=`<tr><td style="font-size:11px;color:var(--text2);white-space:nowrap">${d}</td>${cells}</tr>`;
  });

  el.innerHTML=`<div class="result-card">
    <div style="font-size:15px;font-weight:800;margin-bottom:12px">${name}</div>
    <div class="result-stats">
      <div class="rs-item"><div class="rs-val" style="color:var(--danger)">${totalAbs}</div><div class="rs-label">غياب</div></div>
      <div class="rs-item"><div class="rs-val" style="color:var(--accent)">${dates.length}</div><div class="rs-label">يوم مسجل</div></div>
      <div class="rs-item"><div class="rs-val" style="font-size:13px;color:${level.c}">${level.t}</div><div class="rs-label">المستوى</div></div>
    </div>
    <div style="overflow-x:auto"><table class="stu-table">
      <thead><tr><th>التاريخ</th><th>ح1</th><th>ح2</th><th>ح3</th><th>ح4</th><th>ح5</th><th>ح6</th><th>ح7</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  </div>`;
}

// ─── DATE SEARCH ───
function searchByDate() {
  const cls=document.getElementById('dt-class').value;
  const dateVal=document.getElementById('dt-date').value;
  const el=document.getElementById('dt-result');
  if(!cls||!dateVal){el.innerHTML='<div class="empty">اختر الفصل والتاريخ</div>';return;}
  const dateStr=dateVal.replace(/-/g,'/');
  const students=STUDENTS[cls]||[];
  const dayRecs=ALL_ATT.filter(r=>{
    const d=parseDate(r[1]);
    return String(r[2]||'').trim()===cls && d===dateStr && String(r[5]||'').trim()==='غائب';
  });

  let absentCount=0;
  let rows='';
  students.forEach((name,i)=>{
    const num=i+1;
    const sid=cls.replace('/','')+(num<10?'0':'')+num;
    let cells='';
    let rowAbs=0;
    for(let p=1;p<=7;p++){
      const rec=dayRecs.find(r=>String(r[4]).trim()===sid&&parseInt(r[3])===p);
      if(rec) rowAbs++;
      cells+=`<td style="text-align:center;font-size:13px"><span class="${rec?'dot-no':'dot-ok'}">${rec?'✗':'✓'}</span></td>`;
    }
    if(rowAbs>0) absentCount++;
    rows+=`<tr style="${rowAbs>0?'background:rgba(239,68,68,0.05)':''}">
      <td style="color:var(--text3)">${num}</td>
      <td style="font-size:11px">${name}</td>
      ${cells}
      <td><span style="${rowAbs>0?'background:var(--danger);color:#fff;':'color:var(--success);'}padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700">${rowAbs>0?'غائب':'حاضر'}</span></td>
    </tr>`;
  });

  const cls_obj=CLASSES.find(c=>c.id===cls);
  el.innerHTML=`<div class="result-card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div style="font-size:14px;font-weight:700">${cls_obj?.full||cls}</div>
      <div style="font-size:12px;color:var(--text2)">${dateVal}</div>
    </div>
    <div style="display:flex;gap:12px;margin-bottom:14px">
      <span style="color:var(--danger);font-weight:700">${absentCount} غائب</span>
      <span style="color:var(--success);font-weight:700">${students.length-absentCount} حاضر</span>
    </div>
    ${students.length?`<div style="overflow-x:auto"><table class="stu-table">
      <thead><tr><th>#</th><th>الاسم</th><th>ح1</th><th>ح2</th><th>ح3</th><th>ح4</th><th>ح5</th><th>ح6</th><th>ح7</th><th>الحالة</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`:'<div class="empty">لا توجد بيانات</div>'}
  </div>`;
}

// ─── HIGH ABSENCE ───
function renderHigh() {
  const el=document.getElementById('high-result');
  if(!ALL_ATT.length){el.innerHTML='<div class="loading"><div class="spinner"></div>جارٍ التحميل...</div>';return;}
  const counts={};
  ALL_ATT.forEach(r=>{
    if(String(r[5]||'').trim()!=='غائب') return;
    const cls=String(r[2]||'').trim();
    const sid=String(r[4]||'').trim();
    if(!cls||!sid) return;
    const k=cls+'|'+sid;
    counts[k]=(counts[k]||0)+1;
  });
  const results=[];
  Object.entries(STUDENTS).forEach(([cls,stus])=>{
    const obj=CLASSES.find(c=>c.id===cls);
    stus.forEach((name,i)=>{
      const num=i+1;
      const sid=cls.replace('/','')+(num<10?'0':'')+num;
      const cnt=counts[cls+'|'+sid]||0;
      if(cnt>5) results.push({num,name,cls,full:obj?.full||cls,cnt});
    });
  });
  results.sort((a,b)=>b.cnt-a.cnt);
  if(!results.length){el.innerHTML='<div class="empty"><div class="empty-icon">✅</div>لا يوجد طلاب تجاوز غيابهم 5 أيام</div>';return;}
  el.innerHTML=`<div style="color:var(--text2);font-size:13px;margin-bottom:12px">${results.length} طالب تجاوز غيابه 5 أيام</div>`+
  results.map((s,i)=>`<div class="absence-item">
    <div class="ai-rank">${i+1}</div>
    <div><div class="ai-name">${s.name}</div><div class="ai-class">${s.full}</div></div>
    <div class="ai-count">🔴 ${s.cnt} يوم</div>
  </div>`).join('');
}

  const y=now.getFullYear(), m=String(now.getMonth()+1).padStart(2,'0'), d=String(now.getDate()).padStart(2,'0');

function closePrintModal() {

}

function selectAllPrint() {
  document.querySelectorAll('.print-cls-cb').forEach(cb=>cb.checked=true);
}

function clearAllPrint() {
  document.querySelectorAll('.print-cls-cb').forEach(cb=>cb.checked=false);
}

function doPrint() {
  const dateVal = document.getElementById('printDate').value;
  const dateStr = dateVal.replace(/-/g,'/');
  const selected = [...document.querySelectorAll('.print-cls-cb:checked')].map(cb=>cb.value);
  
  if(!selected.length) { alert('اختر فصل واحد على الأقل'); return; }
  
  let html = '';
  selected.forEach(clsId => {
    const cls = CLASSES.find(c=>c.id===clsId);
    const students = STUDENTS[clsId] || [];
    
    const dayRecs = ALL_ATT.filter(r => {
      const d = parseDate(r[1]);
      return String(r[2]||'').trim()===clsId && d===dateStr && String(r[5]||'').trim()==='غائب';
    });
    
    let absentCount = 0;
    let rows = '';
    students.forEach((name, i) => {
      const num = i+1;
      const sid = clsId.replace('/','') + (num<10?'0':'') + num;
      let cells = '';
      let rowAbs = 0;
      for(let p=1;p<=7;p++) {
        const rec = dayRecs.find(r=>String(r[4]).trim()===sid&&parseInt(r[3])===p);
        if(rec) rowAbs++;
        cells += `<td style="text-align:center">${rec?'✗':'✓'}</td>`;
      }
      if(rowAbs>0) absentCount++;
      rows += `<tr style="${rowAbs>0?'background:#fff0f0':''}">
        <td>${num}</td>
        <td>${name}</td>
        ${cells}
        <td style="text-align:center;font-weight:700">${rowAbs>0?'غائب':'حاضر'}</td>
      </tr>`;
    });

    html += `<div class="print-page">
      <div class="print-header">
        <div class="print-title">متوسطة سالم الحسينان</div>
        <div class="print-sub">كشف الحضور والغياب — ${cls?.full||clsId} — ${dateVal}</div>
      </div>
      <div class="print-stats">
        <div class="print-stat"><span>${students.length}</span>إجمالي</div>
        <div class="print-stat"><span style="color:red">${absentCount}</span>غائب</div>
        <div class="print-stat"><span style="color:green">${students.length-absentCount}</span>حاضر</div>
      </div>
      <table class="print-table">
        <thead><tr><th>#</th><th>اسم الطالب</th><th>ح1</th><th>ح2</th><th>ح3</th><th>ح4</th><th>ح5</th><th>ح6</th><th>ح7</th><th>الحالة</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
  });
  
  document.getElementById('printArea').innerHTML = html;
  closePrintModal();
  setTimeout(()=>{
    window.print();
    document.getElementById('printArea').innerHTML = '';
  }, 300);
}

// ─── REGISTER ───
let regPeriod = 1;
let regType = 'غائب';
let selectedStudents = new Set();

function initRegister() {
  const sel = document.getElementById('reg-class');
  if(sel.options.length > 1) return;
  CLASSES.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.id; opt.textContent = c.full;
    sel.appendChild(opt);
  });
  // set today
  const now = new Date();
  const y=now.getFullYear(), m=String(now.getMonth()+1).padStart(2,'0'), d=String(now.getDate()).padStart(2,'0');
  document.getElementById('reg-date').value = `${y}-${m}-${d}`;
}

function selectPeriod(id, btn) {
  regPeriod = id;
  document.querySelectorAll('.period-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

function selectType(type, btn) {
  regType = type;
  document.querySelectorAll('.type-btn').forEach(b=>{b.classList.remove('active');b.classList.remove('late');});
  btn.classList.add('active');
  if(type==='متأخر') btn.classList.add('late');
}

function loadRegStudents() {
  const clsId = document.getElementById('reg-class').value;
  const section = document.getElementById('reg-students-section');
  const list = document.getElementById('reg-students-list');
  selectedStudents = new Set();
  updateCount();

  if(!clsId) { section.style.display='none'; return; }

  const students = STUDENTS[clsId] || [];
  if(!students.length) {
    list.innerHTML = '<div class="empty" style="padding:16px">لا توجد بيانات طلاب</div>';
    section.style.display = 'block';
    return;
  }

  list.innerHTML = students.map((name,i) => `
    <button class="stu-btn" id="sb-${i+1}" onclick="toggleStudent(${i+1})">
      <span class="stu-num">${i+1}</span>
      <span style="flex:1;text-align:right;padding:0 8px">${name}</span>
      <span class="stu-status" id="ss-${i+1}">⚪</span>
    </button>
  `).join('');

  section.style.display = 'block';
  document.getElementById('reg-success').style.display = 'none';
}

function toggleStudent(num) {
  const btn = document.getElementById('sb-'+num);
  const ico = document.getElementById('ss-'+num);
  if(selectedStudents.has(num)) {
    selectedStudents.delete(num);
    btn.classList.remove('selected');
    ico.textContent = '⚪';
  } else {
    selectedStudents.add(num);
    btn.classList.add('selected');
    ico.textContent = '🔴';
  }
  updateCount();
}

function updateCount() {
  const el = document.getElementById('reg-selected-count');
  const txt = document.getElementById('reg-count-text');
  if(selectedStudents.size > 0) {
    el.style.display = 'block';
    txt.textContent = `${selectedStudents.size} طالب محدد كـ ${regType}`;
  } else {
    el.style.display = 'none';
  }
}

async function saveAttendance() {
  const clsId = document.getElementById('reg-class').value;
  const dateVal = document.getElementById('reg-date').value;
  const btn = document.getElementById('reg-save-btn');

  if(!clsId || !dateVal) { alert('اختر الفصل والتاريخ'); return; }
  if(selectedStudents.size === 0) { alert('اختر طالباً واحداً على الأقل'); return; }

  btn.textContent = '⏳ جارٍ الحفظ...';
  btn.disabled = true;

  const students = STUDENTS[clsId] || [];
  const records = [];

  selectedStudents.forEach(num => {
    const sid = clsId.replace('/','') + (num<10?'0':'') + num;
    const rowId = 'R' + Date.now() + Math.random().toString(36).substr(2,4);
    records.push({
      rowId,
      date: dateVal,
      classId: clsId,
      periodId: regPeriod,
      studentId: sid,
      status: regType,
      attendanceType: regType === 'غائب' ? 'بدون عذر' : 'متأخر',
      reason: '',
      recordedBy: ''
    });
  });

  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ records }),
      headers: { 'Content-Type': 'application/json' }
    });
    const json = await res.json();

    if(json.success) {
      const cls = CLASSES.find(c=>c.id===clsId);
      document.getElementById('reg-success-msg').textContent =
        `تم تسجيل ${selectedStudents.size} طالب كـ ${regType} في ${cls?.full||clsId} — الحصة ${regPeriod}`;
      document.getElementById('reg-students-section').style.display = 'none';
      document.getElementById('reg-success').style.display = 'block';
      loadData();
    } else {
      alert('حدث خطأ: ' + (json.error||'غير معروف'));
    }
  } catch(e) {
    alert('فشل الاتصال بالخادم');
  }

  btn.textContent = '✅ حفظ الغياب';
  btn.disabled = false;
}

function resetRegister() {
  document.getElementById('reg-class').value = '';
  document.getElementById('reg-students-section').style.display = 'none';
  document.getElementById('reg-success').style.display = 'none';
  selectedStudents = new Set();
  regPeriod = 1;
  document.querySelectorAll('.period-btn').forEach((b,i)=>{ b.classList.toggle('active', i===0); });
}

// ─── EXTEND switchTab ───
const _origSwitchTab = switchTab;
function switchTab(id, btn) {
  document.querySelectorAll('[id^="tab-"]').forEach(el=>el.style.display='none');
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+id).style.display='block';
  btn.classList.add('active');
  if(id==='high' && loaded) renderHigh();
  if(id==='register') { initRegister(); }
}

loadData();
setInterval(loadData, 60000);
